const parseCSVLine=s=>{const r=[];let c='',q=false;for(let i=0;i<s.length;i++){if(s[i]==='"'){q=!q}else if(s[i]===','&&!q){r.push(c);c=''}else{c+=s[i]}}r.push(c);return r.map(x=>x.trim().replace(/^"|"$/g,''))};

const parseLBCsv=text=>{
const lines=text.split('\n').filter(l=>l.trim());
if(lines.length<2)return[];
const hdr=parseCSVLine(lines[0]).map(h=>h.toLowerCase());
const ti=hdr.findIndex(h=>/^(name|title|film)/.test(h));
const yi=hdr.findIndex(h=>/^year/.test(h));
const ri=hdr.findIndex(h=>/^rating/.test(h));
if(ti<0)return[];
const seen=new Set(),films=[];
for(let i=1;i<lines.length;i++){
const cols=parseCSVLine(lines[i]);
const title=cols[ti]?.trim();
if(!title||seen.has(title))continue;
seen.add(title);
let rating=ri>=0?parseFloat(cols[ri]):null;
if(rating&&rating>5)rating=rating/2;
films.push({title,year:yi>=0?cols[yi]?.trim():'',rating:isNaN(rating)?null:rating});
}return films};

const loadJSZip=()=>new Promise((res,rej)=>{
if(window.JSZip)return res(window.JSZip);
const s=document.createElement('script');
s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
s.onload=()=>res(window.JSZip);s.onerror=rej;document.head.appendChild(s)});

const parseLBZip=async file=>{
const JSZip=await loadJSZip();
const zip=await JSZip.loadAsync(file);
for(const name of['ratings.csv','diary.csv','watched.csv','reviews.csv']){
const f=zip.file(name);if(f){const t=await f.async('text');const r=parseLBCsv(t);if(r.length)return r}}
return[]};

const callAI=async(key,prompt,maxTokens=2000)=>{
const res=await fetch("https://api.anthropic.com/v1/messages",{
method:"POST",
headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:maxTokens,messages:[{role:"user",content:prompt}]})
});
if(!res.ok)throw new Error("API error: "+res.status);
const data=await res.json();
const text=data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
const clean=text.replace(/```json|```/g,"").trim();
const m=clean.match(/\{[\s\S]*\}/);
return JSON.parse(m?m[0]:clean)};

const streamUrl=(service,title)=>{
const t=encodeURIComponent(title);
const link=STREAM_LINKS[service];
if(!link)return null;
if(service==='Prime Video')return link.replace('TITLE',t);
return link+t};

/* ===== WIZARD COMPONENT ===== */
const Wizard=({icon,title,steps,onDone,strSel,onStrToggle})=>{
const[step,setStep]=useState(0);
const[answers,setAnswers]=useState({});
const[text,setText]=useState('');
const[showCustom,setShowCustom]=useState(false);
const cur=steps[step];

const next=val=>{
const na={...answers,[cur.id]:val};
setAnswers(na);setText('');setShowCustom(false);
if(step<steps.length-1)setStep(step+1);else onDone(na)};
const skip=()=>{setText('');setShowCustom(false);if(step<steps.length-1)setStep(step+1);else onDone(answers)};
const back=()=>{if(step>0){setStep(step-1);setText('')}};

return<Shell><Hdr title={title} onBack={step>0?back:null}/><ProgBar step={step+1} total={steps.length}/><div key={step} style={{animation:'si 0.3s ease',padding:'20px 0'}}>
<div style={{textAlign:'center',fontSize:48,marginBottom:16}}>{icon}</div>
<h2 style={{fontFamily:"'Playfair Display',serif",fontSize:24,textAlign:'center',marginBottom:8}}>{cur.q}</h2>
{cur.sub&&<p style={{...sty.sub,textAlign:'center',marginBottom:16}}>{cur.sub}</p>}

{cur.special==='streaming'?<div style={{padding:'16px 0'}}><StreamCheck sel={strSel||[]} onToggle={onStrToggle}/><div style={{marginTop:16,display:'flex',gap:8}}><Btn primary onClick={()=>next(strSel||[])}>Next</Btn><Btn onClick={skip}>Skip</Btn></div></div>

:cur.type==='text'?<div style={{padding:'16px 0'}}>
<input style={sty.input} value={text} onChange={e=>setText(e.target.value)} placeholder={cur.ph||''} onKeyDown={e=>e.key==='Enter'&&text.trim()&&next(text.trim())}/>
{cur.chips&&<div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:12}}>{cur.chips.map(c=><button key={c} style={sty.chip} onClick={()=>setText(t=>t?t+', '+c:c)}>{c}</button>)}</div>}
<div style={{display:'flex',gap:8,marginTop:16}}><Btn primary onClick={()=>next(text.trim())} disabled={!text.trim()}>Next</Btn><Btn onClick={skip}>Skip</Btn></div></div>

:<div><div style={{display:'grid',gridTemplateColumns:cur.cols===1?'1fr':'1fr 1fr',gap:8,marginTop:16}}>
{(cur.opts||[]).map((o,i)=>{const label=typeof o==='string'?o:o.l;const val=typeof o==='string'?o:o.v;
return<button key={i} onClick={()=>next(val)} style={{...sty.card,cursor:'pointer',textAlign:'center',fontSize:14,padding:'14px 8px',transition:'all 0.15s',border:'1px solid rgba(255,255,255,0.08)'}}
onMouseOver={e=>e.currentTarget.style.borderColor='#e8a948'} onMouseOut={e=>e.currentTarget.style.borderColor='rgba(255,255,255,0.08)'}>{label}</button>})}
</div>
{!cur.special&&cur.type!=='text'&&<div style={{marginTop:12}}><button style={{...sty.tert,background:'none',border:'none',cursor:'pointer',fontSize:13}} onClick={()=>setShowCustom(!showCustom)}>✏️ Type your own</button>
{showCustom&&<div style={{display:'flex',gap:8,marginTop:8}}><input style={{...sty.input,flex:1}} value={text} onChange={e=>setText(e.target.value)} placeholder="Type here..." onKeyDown={e=>e.key==='Enter'&&text.trim()&&next(text.trim())}/><Btn primary onClick={()=>text.trim()&&next(text.trim())} style={{width:'auto',padding:'12px 16px'}}>Use</Btn></div>}
</div>}
<button onClick={skip} style={{...sty.tert,background:'none',border:'none',cursor:'pointer',display:'block',margin:'16px auto',fontSize:13}}>Skip →</button>
</div>}
</div></Shell>};

/* ===== LETTERBOXD IMPORT COMPONENT ===== */
const LBImport=({lb,onDone,onSkip})=>{
const[dragging,setDragging]=useState(false);
const[err,setErr]=useState(null);
const[loading,setLoading]=useState(false);
const fileRef=useRef();

const handleFile=async file=>{
setErr(null);setLoading(true);
try{
let films;
if(file.name.endsWith('.zip')){films=await parseLBZip(file)}
else if(file.name.endsWith('.csv')){const t=await file.text();films=parseLBCsv(t)}
else{setErr('Please upload a .zip or .csv file');setLoading(false);return}
if(!films.length){setErr('No films found in file');setLoading(false);return}
onDone(films);
}catch(e){setErr('Failed to parse file: '+e.message)}
setLoading(false)};

const onDrop=e=>{e.preventDefault();setDragging(false);const f=e.dataTransfer.files[0];if(f)handleFile(f)};
const onChange=e=>{const f=e.target.files[0];if(f)handleFile(f)};

return<Shell><Hdr title="Import Letterboxd"/>
<div style={{textAlign:'center',padding:'40px 0',animation:'fu 0.4s ease'}}>
<div style={{fontSize:48,marginBottom:16}}>📋</div>
<h2 style={{fontFamily:"'Playfair Display',serif",marginBottom:8}}>Import Your Letterboxd</h2>
<p style={sty.sub}>So we don't recommend films you've already seen</p>
{lb.length>0&&<div style={{background:'rgba(74,222,128,0.1)',border:'1px solid rgba(74,222,128,0.2)',borderRadius:12,padding:'12px 16px',marginTop:16,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
<span style={{color:'#4ade80',fontSize:14}}>✅ {lb.length} Letterboxd films loaded</span>
<button onClick={()=>onDone([])} style={{background:'none',border:'none',color:'#e85454',cursor:'pointer',fontSize:13}}>Clear</button></div>}
<div onDragOver={e=>{e.preventDefault();setDragging(true)}} onDragLeave={()=>setDragging(false)} onDrop={onDrop} onClick={()=>fileRef.current.click()}
style={{...sty.card,marginTop:20,padding:'40px 20px',cursor:'pointer',borderColor:dragging?'#e8a948':'rgba(255,255,255,0.08)',borderStyle:'dashed',textAlign:'center'}}>
<input ref={fileRef} type="file" accept=".zip,.csv" style={{display:'none'}} onChange={onChange}/>
{loading?<div style={{animation:'pulse 1.5s infinite'}}>Processing...</div>
:<><div style={{fontSize:32,marginBottom:8}}>📁</div><p style={sty.sub}>Drop your Letterboxd .zip or .csv here</p><p style={sty.tert}>or tap to browse</p></>}
</div>
{err&&<p style={{color:'#e85454',fontSize:14,marginTop:12}}>❌ {err}</p>}
<p style={{...sty.tert,marginTop:16}}>Get your export from <a href="https://letterboxd.com/settings/data/" target="_blank" rel="noopener">letterboxd.com/settings/data/</a></p>
<div style={{display:'flex',gap:8,marginTop:24}}>
{lb.length>0&&<Btn primary onClick={()=>onSkip()}>Continue with {lb.length} films</Btn>}
<Btn onClick={onSkip}>{lb.length>0?'Continue':'Skip'}</Btn></div>
</div></Shell>};


/* ===== MAIN APP COMPONENT ===== */
const App=()=>{
const[apiKey,setApiKey]=useState('');
const[showKey,setShowKey]=useState(false);
const[phase,setPhase]=useState('home');
const[step,setStep]=useState(0);
const[ans,setAns]=useState({});
const[cIns,setCIns]=useState({});
const[tAns,setTAns]=useState({});
const[strSel,setStrSel]=useState([]);
const[movies,setMovies]=useState(null);
const[lb,setLb]=useState([]);
const[lastA,setLastA]=useState(null);
const[rIdx,setRIdx]=useState(-1);
const[soL,setSoL]=useState(false);
const[dis,setDis]=useState([]);
const[cmp,setCmp]=useState(new Set());
const[h2h,setH2h]=useState(null);
const[h2hData,setH2hData]=useState(null);
const[expanded,setExpanded]=useState({});
const[moreOpen,setMoreOpen]=useState(false);
const[groupNames,setGroupNames]=useState(['','']);
const[groupStep,setGroupStep]=useState(0);
const[groupAnswers,setGroupAnswers]=useState({});
const[customResults,setCustomResults]=useState(null);
const[rouletteSpinning,setRouletteSpinning]=useState(false);
const[rouletteDeg,setRouletteDeg]=useState(0);
const[totStep,setTotStep]=useState(0);
const[totAnswers,setTotAnswers]=useState([]);
const[err,setErr]=useState(null);
const[copied,setCopied]=useState(false);
const[currentMode,setCurrentMode]=useState(null);
const[selCustomText,setSelCustomText]=useState('');
const[selShowCust,setSelShowCust]=useState(false);
const[textInput,setTextInput]=useState('');

const home=()=>{setPhase('home');setStep(0);setAns({});setCIns({});setTAns({});setMovies(null);setLastA(null);setRIdx(-1);setSoL(false);setDis([]);setCmp(new Set());setH2h(null);setH2hData(null);setExpanded({});setMoreOpen(false);setGroupNames(['','']);setGroupStep(0);setGroupAnswers({});setCustomResults(null);setRouletteSpinning(false);setRouletteDeg(0);setTotStep(0);setTotAnswers([]);setErr(null);setCopied(false);setCurrentMode(null);setSelCustomText('');setSelShowCust(false);setTextInput('')};

const filmJSON=`{"reason":"...","films":[{"title":"...","year":"...","genre":"...","director":"...","runtime":"...","description":"2-3 sentences","whyThisFilm":"1 sentence referencing preferences","rottenTomatoes":"...%","imdb":".../10","letterboxd":".../5","ageRating":"...","streaming":"..."}]}`;

const buildPickerPrompt=(a,count=3)=>{
let p=`You are a film recommendation expert. Based on these preferences, recommend exactly ${count} films.\n\n`;
Object.entries(a).forEach(([k,v])=>{if(v&&v!==''){p+=`${k}: ${typeof v==='object'?JSON.stringify(v):v}\n`}});
if(lb.length>0){
const watched=lb.slice(0,150).map(f=>f.title).join(', ');
const top=lb.filter(f=>f.rating).sort((a,b)=>b.rating-a.rating).slice(0,20).map(f=>`${f.title} (${f.rating}★)`).join(', ');
const recent=lb.slice(-15).map(f=>f.title).join(', ');
p+=`\nWatched films (NEVER recommend any of these): ${watched}\nTop-rated: ${top}\nRecent: ${recent}\n`}
if(dis.length>0)p+=`\nAlso exclude: ${dis.join(', ')}\n`;
p+=`\nRules: Real films only, real data only. ${count} different films. whyThisFilm must reference specific preferences. Match era/runtime/language/age rating strictly. If age rating specified, only recommend that or lower. Use exact streaming service name.\n`;
p+=`Reply ONLY JSON: ${filmJSON}`;
return p};

const fetchFilms=async(a,count=3)=>{
setPhase('loading');setLastA(a);
try{const r=await callAI(apiKey,buildPickerPrompt(a,count));setMovies(r);setPhase('results')}
catch(e){setErr(e.message);setPhase('error')}};

const replaceFn=async(idx)=>{
if(rIdx>=0)return;
setRIdx(idx);
const film=movies.films[idx];
const newDis=[...dis,film.title];setDis(newDis);
try{
const p=buildPickerPrompt({...lastA,excludeExtra:newDis.join(', ')},1).replace(`exactly 1`,`exactly 1 replacement`);
const r=await callAI(apiKey,p);
if(r.films&&r.films[0]){const nf=[...movies.films];nf[idx]=r.films[0];setMovies({...movies,films:nf})}
}catch(e){setErr(e.message)}
setRIdx(-1)};

const secondOpinion=async(direction)=>{
setSoL(true);
try{
const p=buildPickerPrompt(lastA).replace('Based on these preferences',`Based on these preferences, but this time go ${direction}. Give completely different films from before`);
const r=await callAI(apiKey,p);setMovies(r);setDis([]);setCmp(new Set())
}catch(e){setErr(e.message)}
setSoL(false)};

const compareFilms=async()=>{
const indices=[...cmp];
const fA=movies.films[indices[0]],fB=movies.films[indices[1]];
setH2h({a:fA,b:fB});setH2hData(null);setPhase('h2h');
try{
const p=`Compare these two films:\nFilm A: ${fA.title} (${fA.year})\nFilm B: ${fB.title} (${fB.year})\n\nGive a verdict. Reply ONLY JSON: {"verdict":"2 sentences comparing them","winner":"Film title","winReason":"1 sentence"}`;
const r=await callAI(apiKey,p);setH2hData(r)
}catch(e){setErr(e.message);setPhase('error')}};

const sharePicks=()=>{
if(!movies||!movies.films)return;
const txt=movies.films.map((f,i)=>`${i+1}. ${f.title} (${f.year})\n   Director: ${f.director}\n   ${f.rottenTomatoes?'RT: '+f.rottenTomatoes:''} ${f.imdb?'IMDb: '+f.imdb:''} ${f.letterboxd?'LB: '+f.letterboxd:''}\n   ${f.description}`).join('\n\n');
navigator.clipboard.writeText('🎬 Film Picks\n\n'+txt).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2500)})};

const strToggle=s=>{if(s==='ALL'){setStrSel([])}else{setStrSel(p=>p.includes(s)?p.filter(x=>x!==s):[...p,s])}};

/* ===== FULL PICKER SELECT QUESTIONS ===== */
const renderSelectQ=()=>{
const q=SEL_QS[step];
const advance=val=>{setSelCustomText('');setSelShowCust(false);setAns({...ans,[q.id]:val});if(step<SEL_QS.length-1)setStep(step+1);else setStep(SEL_QS.length)};
const skipQ=()=>{setSelCustomText('');setSelShowCust(false);if(step<SEL_QS.length-1)setStep(step+1);else setStep(SEL_QS.length)};

return<Shell><Hdr title="Film Picker" onBack={step>0?()=>{setSelCustomText('');setSelShowCust(false);setStep(step-1)}:()=>home()}/><ProgBar step={step+1} total={SEL_QS.length+TEXT_QS.length}/>
<div key={step} style={{animation:'si 0.3s ease',padding:'12px 0'}}>
<h2 style={{fontFamily:"'Playfair Display',serif",fontSize:22,textAlign:'center',marginBottom:6}}>{q.q}</h2>
{q.sub&&<p style={{...sty.sub,textAlign:'center',marginBottom:12}}>{q.sub}</p>}
<div style={{display:'grid',gridTemplateColumns:q.cols===2?'1fr 1fr':'1fr',gap:8}}>
{q.opts.map((o,i)=><button key={i} onClick={()=>advance(o)} style={{...sty.card,cursor:'pointer',textAlign:'center',fontSize:14,padding:'12px 8px'}} onMouseOver={e=>e.currentTarget.style.borderColor='#e8a948'} onMouseOut={e=>e.currentTarget.style.borderColor='rgba(255,255,255,0.08)'}>{o}</button>)}
</div>
<div style={{marginTop:12}}><button style={{...sty.tert,background:'none',border:'none',cursor:'pointer',fontSize:13}} onClick={()=>setSelShowCust(!selShowCust)}>✏️ Type your own</button>
{selShowCust&&<div style={{display:'flex',gap:8,marginTop:8}}><input style={{...sty.input,flex:1}} value={selCustomText} onChange={e=>setSelCustomText(e.target.value)} placeholder="Type here..." onKeyDown={e=>e.key==='Enter'&&selCustomText.trim()&&advance(selCustomText.trim())}/><Btn primary onClick={()=>selCustomText.trim()&&advance(selCustomText.trim())} style={{width:'auto',padding:'12px 16px'}}>Use</Btn></div>}
</div>
<button onClick={skipQ} style={{...sty.tert,background:'none',border:'none',cursor:'pointer',display:'block',margin:'16px auto',fontSize:13}}>Skip →</button>
</div></Shell>};

/* ===== FULL PICKER TEXT QUESTIONS ===== */
const renderTextQ=()=>{
const qi=step-SEL_QS.length;
const q=TEXT_QS[qi];
const advance=val=>{setTextInput('');setTAns({...tAns,[q.id]:val});if(qi<TEXT_QS.length-1)setStep(step+1);else{fetchFilms({...ans,...tAns,[q.id]:val,streaming:strSel})}};
const skipQ=()=>{setTextInput('');if(qi<TEXT_QS.length-1)setStep(step+1);else{fetchFilms({...ans,...tAns,streaming:strSel})}};

if(q.special==='streaming')return<Shell><Hdr title="Film Picker" onBack={()=>setStep(step-1)}/><ProgBar step={step+1} total={SEL_QS.length+TEXT_QS.length}/>
<div style={{animation:'si 0.3s ease',padding:'20px 0'}}><h2 style={{fontFamily:"'Playfair Display',serif",fontSize:22,textAlign:'center',marginBottom:16}}>{q.q}</h2>
<StreamCheck sel={strSel} onToggle={strToggle}/>
<div style={{display:'flex',gap:8,marginTop:20}}><Btn primary onClick={()=>advance(strSel)}>Next</Btn><Btn onClick={skipQ}>Skip</Btn></div></div></Shell>;

return<Shell><Hdr title="Film Picker" onBack={()=>{setTextInput('');setStep(step-1)}}/><ProgBar step={step+1} total={SEL_QS.length+TEXT_QS.length}/>
<div key={step} style={{animation:'si 0.3s ease',padding:'20px 0'}}>
<h2 style={{fontFamily:"'Playfair Display',serif",fontSize:22,textAlign:'center',marginBottom:16}}>{q.q}</h2>

<div style={{animation:'fu 0.4s ease'}}>
{d.theme&&<h2 style={{fontFamily:"'Playfair Display',serif",textAlign:'center',marginBottom:8}}>🎭 {d.theme}</h2>}
{d.whyTheyPair&&<p style={{...sty.sub,textAlign:'center',marginBottom:16,fontStyle:'italic'}}>"{d.whyTheyPair}"</p>}
{films.map((f,i)=><FC key={i} film={f} idx={i} compact/>)}
{d.watchOrder&&<div style={{...sty.card,background:'rgba(168,85,247,0.08)',borderColor:'rgba(168,85,247,0.2)'}}><p style={{fontSize:14,color:'#a855f7'}}>📋 {d.watchOrder}</p></div>}
<Btn onClick={home} style={{marginTop:16}}>🏠 Home</Btn></div></Shell>}

if(type==='actor'){
return<Shell><Hdr title="Actor Deep Dive" onBack={home}/>
<div style={{animation:'fu 0.4s ease'}}>
<h2 style={{fontFamily:"'Playfair Display',serif",textAlign:'center',marginBottom:8}}>🌟 {d.actor}</h2>
{d.careerArc&&<p style={{...sty.sub,textAlign:'center',marginBottom:16}}>{d.careerArc}</p>}
{(d.films||[]).map((f,i)=><div key={i} style={{...sty.card,animation:'fu 0.4s ease',animationDelay:`${i*0.1}s`,animationFillMode:'both'}}>
<div style={{display:'flex',alignItems:'center',gap:12,marginBottom:8}}>
<span style={{...sty.badge,background:'linear-gradient(135deg,#e8a948,#f0c06e)',color:'#0c0f1a',fontWeight:700,fontSize:18,width:36,height:36,display:'flex',alignItems:'center',justifyContent:'center',borderRadius:'50%'}}>#{f.rank}</span>
<div><div style={{fontWeight:700}}>{f.title} <span style={sty.tert}>({f.year})</span></div><div style={sty.sub}>as {f.role} · dir. {f.director}</div></div>
</div>
<p style={sty.sub}>{f.description||f.rating}</p>
<div style={{display:'flex',gap:6,marginTop:8}}>
{f.rottenTomatoes&&<span style={{...sty.badge,background:'rgba(232,84,84,0.15)',color:'#e85454',fontSize:12}}>🍅 {f.rottenTomatoes}</span>}
{f.imdb&&<span style={{...sty.badge,background:'rgba(232,169,72,0.15)',color:'#e8a948',fontSize:12}}>⭐ {f.imdb}</span>}
{f.letterboxd&&<span style={{...sty.badge,background:'rgba(74,222,128,0.15)',color:'#4ade80',fontSize:12}}>💚 {f.letterboxd}</span>}
</div></div>)}
{d.underrated&&<div style={{...sty.card,background:'rgba(232,169,72,0.06)',borderColor:'rgba(232,169,72,0.15)'}}>
<h3 style={{color:'#e8a948',marginBottom:8}}>💎 Hidden Gem</h3>
<div style={{fontWeight:600}}>{d.underrated.title} <span style={sty.tert}>({d.underrated.year})</span></div>
{d.underrated.role&&<div style={sty.sub}>as {d.underrated.role}</div>}
<p style={{...sty.sub,marginTop:4}}>{d.underrated.reason}</p></div>}
<Btn onClick={home} style={{marginTop:16}}>🏠 Home</Btn></div></Shell>}

if(type==='soundtrack'){
const films=d.films||movies?.films||[];
return<Shell><Hdr title="Soundtrack Finder" onBack={home}/>
<div style={{animation:'fu 0.4s ease'}}>
{d.vibe&&<h2 style={{fontFamily:"'Playfair Display',serif",textAlign:'center',marginBottom:16}}>🎵 {d.vibe}</h2>}
{films.map((f,i)=><FC key={i} film={f} idx={i}/>)}
<Btn onClick={home} style={{marginTop:16}}>🏠 Home</Btn></div></Shell>}

if(type==='autopsy'){
const fixes=d.fixes||movies?.films||[];
return<Shell><Hdr title="Film Autopsy" onBack={home}/>
<div style={{animation:'fu 0.4s ease'}}>
<h2 style={{fontFamily:"'Playfair Display',serif",textAlign:'center',marginBottom:16}}>🔬 {d.film}</h2>
{d.diagnosis&&<div style={{...sty.card,background:'rgba(232,84,84,0.06)',borderColor:'rgba(232,84,84,0.15)'}}><h3 style={{color:'#e85454',marginBottom:8}}>💀 Diagnosis</h3><p style={sty.sub}>{d.diagnosis}</p></div>}
{d.whatYouWanted&&<div style={{...sty.card,background:'rgba(232,169,72,0.06)',borderColor:'rgba(232,169,72,0.15)'}}><h3 style={{color:'#e8a948',marginBottom:8}}>💭 What You Wanted</h3><p style={sty.sub}>{d.whatYouWanted}</p></div>}
<h3 style={{fontFamily:"'Playfair Display',serif",margin:'16px 0 8px'}}>💊 The Fix</h3>
{fixes.map((f,i)=><FC key={i} film={f} idx={i}/>)}
<Btn onClick={home} style={{marginTop:16}}>🏠 Home</Btn></div></Shell>}

if(type==='swap'){
return<Shell><Hdr title="Mood Swap" onBack={home}/>
<div style={{animation:'fu 0.4s ease'}}>
{d.original&&<div style={sty.card}><h3 style={{marginBottom:8}}>{d.original.title}</h3><p style={sty.sub}>{d.original.analysis}</p></div>}
<div style={{textAlign:'center',margin:'16px 0',color:'#6b6780'}}>🔄 ─── Flipped ─── 🔄</div>
{d.opposite&&<FC film={d.opposite} idx={1}/>}
{d.whyOpposite&&<div style={{...sty.card,background:'rgba(16,185,129,0.06)',borderColor:'rgba(16,185,129,0.15)'}}><p style={{fontSize:14,color:'#10b981'}}>{d.whyOpposite}</p></div>}
<Btn onClick={home} style={{marginTop:16}}>🏠 Home</Btn></div></Shell>}

if(type==='family'){
const films=d.films||movies?.films||[];
return<Shell><Hdr title="Family Film Picker" onBack={home}/>
<div style={{animation:'fu 0.4s ease'}}>
{d.ages&&<div style={{...sty.badge,background:'rgba(244,114,182,0.15)',color:'#f472b6',marginBottom:16,display:'inline-block'}}>👶 Ages: {d.ages}</div>}
{films.map((f,i)=><FC key={i} film={f} idx={i}/>)}
<Btn onClick={home} style={{marginTop:16}}>🏠 Home</Btn></div></Shell>}

return renderResults()};


/* ===== HOME SCREEN ===== */
const renderHome=()=>(
<Shell>
<div style={{textAlign:'center',paddingTop:60,animation:'fu 0.5s ease'}}>
<div style={{fontSize:64,marginBottom:16,animation:'glow 2s ease-in-out infinite',display:'inline-block',borderRadius:'50%'}}>🎬</div>
<h1 style={{fontFamily:"'Playfair Display',serif",fontSize:36,fontWeight:700,marginBottom:8}}>Film Picker</h1>
<p style={sty.sub}>Find something to watch tonight</p>

{!apiKey.startsWith('sk-')?<div style={{marginTop:24,textAlign:'left'}}>
<p style={{...sty.tert,marginBottom:8}}>Enter your Anthropic API key to get started</p>
<input type={showKey?'text':'password'} style={sty.input} value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="sk-ant-..."/>
<div style={{display:'flex',gap:8,alignItems:'center',marginTop:8}}>
<button onClick={()=>setShowKey(!showKey)} style={{...sty.tert,background:'none',border:'none',cursor:'pointer',fontSize:12}}>{showKey?'Hide':'Show'} key</button>
</div>
</div>

:<>
{lb.length>0&&<div style={{background:'rgba(74,222,128,0.1)',border:'1px solid rgba(74,222,128,0.2)',borderRadius:12,padding:'10px 16px',marginTop:16,display:'inline-flex',alignItems:'center',gap:8}}>
<span style={{color:'#4ade80'}}>✅ {lb.length} Letterboxd films loaded</span></div>}

<button onClick={()=>setPhase('lb')} style={{...sty.btnP,marginTop:24,padding:'18px 24px',fontSize:18,borderRadius:16,animation:'glow 2s ease-in-out infinite'}}>🎬 Pick a Film</button>

<button onClick={()=>setMoreOpen(!moreOpen)} style={{...sty.btnS,marginTop:12}}>{moreOpen?'Hide options ↑':'Do something else ↓'}</button>

{moreOpen&&<div style={{marginTop:16,animation:'fu 0.3s ease'}}>
{MODE_CARDS.map(m=><button key={m.id} onClick={()=>{
setCurrentMode(m.id);
if(m.id==='lightning')doLightning();
else if(m.id==='roulette')setPhase('roulette');
else if(m.id==='calendar')doCalendar();
else if(m.id==='tot'){setTotStep(0);setTotAnswers([]);setPhase('tot')}
else if(m.id==='group'){setGroupNames(['','']);setPhase('group')}
else if(m.id==='lb_standalone')setPhase('lb_standalone');
else setPhase(m.id)
}} style={{...sty.card,display:'flex',alignItems:'center',gap:14,cursor:'pointer',textAlign:'left',width:'100%',transition:'all 0.15s'}}
onMouseOver={e=>e.currentTarget.style.borderColor=m.col} onMouseOut={e=>e.currentTarget.style.borderColor='rgba(255,255,255,0.08)'}>
<div style={{width:44,height:44,borderRadius:12,background:`${m.col}20`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,flexShrink:0}}>{m.icon}</div>
<div><div style={{fontWeight:600,fontSize:15}}>{m.title}</div><div style={sty.tert}>{m.desc}</div></div>
</button>)}
</div>}
</>}
</div></Shell>);

/* ===== ROULETTE SCREEN ===== */
const renderRoulette=()=>(
<Shell><Hdr title="Film Roulette" onBack={home}/>
<div style={{textAlign:'center',padding:'60px 0',animation:'fu 0.4s ease'}}>
<div style={{fontSize:80,marginBottom:24,display:'inline-block',transition:rouletteSpinning?'transform 3s cubic-bezier(0.17,0.67,0.12,0.99)':'none',transform:rouletteSpinning?`rotate(${rouletteDeg}deg)`:'none'}}>🎰</div>
<h2 style={{fontFamily:"'Playfair Display',serif",fontSize:28,marginBottom:8}}>Film Roulette</h2>
<p style={sty.sub}>Spin the wheel and let fate decide</p>
<Btn primary onClick={doRoulette} disabled={rouletteSpinning} style={{marginTop:32,maxWidth:240,margin:'32px auto 0'}}>
{rouletteSpinning?'Spinning...':'🎰 Spin the Wheel'}</Btn>
<Btn onClick={home} style={{marginTop:12,maxWidth:240,margin:'12px auto 0'}}>🏠 Home</Btn>
</div></Shell>);

/* ===== ERROR SCREEN ===== */
const renderError=()=>(
<Shell><div style={{textAlign:'center',padding:'80px 20px',animation:'fu 0.4s ease'}}>
<div style={{fontSize:48,marginBottom:16}}>😵</div>
<h2 style={{fontFamily:"'Playfair Display',serif",marginBottom:8}}>Something went wrong</h2>
<p style={{...sty.sub,marginBottom:4}}>{err||'An unexpected error occurred'}</p>
<p style={sty.tert}>Check your API key and try again</p>
<div style={{display:'flex',gap:8,marginTop:24,justifyContent:'center'}}>
<Btn primary onClick={()=>{setErr(null);if(lastA)fetchFilms(lastA);else home()}}>Try Again</Btn>
<Btn onClick={home}>🏠 Home</Btn>
</div></div></Shell>);

/* ===== PHASE ROUTER ===== */
if(phase==='home')return renderHome();
if(phase==='error')return renderError();
if(phase==='loading')return<Shell><Loader/></Shell>;
if(phase==='h2h')return renderH2H();
if(phase==='tot')return renderToT();
if(phase==='roulette')return renderRoulette();
if(phase==='group')return renderGroupSetup();
if(phase==='group_vote')return renderGroupVote();

if(phase==='lb'||phase==='lb_standalone')return<LBImport lb={lb} onDone={films=>{setLb(films);if(phase==='lb'){setPhase('questions');setStep(0)}else setPhase('home')}} onSkip={()=>{if(phase==='lb'){setPhase('questions');setStep(0)}else setPhase('home')}}/>;

if(phase==='questions'){
if(step<SEL_QS.length)return renderSelectQ();
return renderTextQ()}

if(phase==='results'){
if(customResults)return renderCustomResults();
return renderResults()}

/* Wizard-based modes */
if(phase==='quick')return<Wizard icon="⚡" title="Quick Pick" steps={QUICK_STEPS} strSel={strSel} onStrToggle={strToggle} onDone={a=>handleWizardDone('quick',a)}/>;
if(phase==='party')return<Wizard icon="🍿" title="Watch Party" steps={PARTY_STEPS} strSel={strSel} onStrToggle={strToggle} onDone={a=>handleWizardDone('party',a)}/>;
if(phase==='debrief')return<Wizard icon="🔍" title="Film Debrief" steps={DEBRIEF_STEPS} strSel={strSel} onStrToggle={strToggle} onDone={a=>handleWizardDone('debrief',a)}/>;
if(phase==='battle')return<Wizard icon="⚔️" title="Film Battle" steps={BATTLE_STEPS} strSel={strSel} onStrToggle={strToggle} onDone={a=>handleWizardDone('battle',a)}/>;
if(phase==='dna')return<Wizard icon="🧬" title="Film DNA" steps={DNA_STEPS} strSel={strSel} onStrToggle={strToggle} onDone={a=>handleWizardDone('dna',a)}/>;
if(phase==='double')return<Wizard icon="🎭" title="Double Bill" steps={DOUBLE_STEPS} strSel={strSel} onStrToggle={strToggle} onDone={a=>handleWizardDone('double',a)}/>;
if(phase==='actor')return<Wizard icon="🌟" title="Actor Deep Dive" steps={ACTOR_STEPS} strSel={strSel} onStrToggle={strToggle} onDone={a=>handleWizardDone('actor',a)}/>;
if(phase==='soundtrack')return<Wizard icon="🎵" title="Soundtrack Finder" steps={SOUNDTRACK_STEPS} strSel={strSel} onStrToggle={strToggle} onDone={a=>handleWizardDone('soundtrack',a)}/>;
if(phase==='autopsy')return<Wizard icon="🔬" title="Film Autopsy" steps={AUTOPSY_STEPS} strSel={strSel} onStrToggle={strToggle} onDone={a=>handleWizardDone('autopsy',a)}/>;
if(phase==='swap')return<Wizard icon="🔄" title="Mood Swap" steps={SWAP_STEPS} strSel={strSel} onStrToggle={strToggle} onDone={a=>handleWizardDone('swap',a)}/>;
if(phase==='family')return<Wizard icon="👨‍👩‍👧‍👦" title="Family Film Picker" steps={FAMILY_STEPS} strSel={strSel} onStrToggle={strToggle} onDone={a=>handleWizardDone('family',a)}/>;

return renderHome();
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
