const hashPw=str=>{str=String(str)+'fp_salt_9x';let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);};

const RUNTIME_MAP={'quick':[0,89],'standard':[90,120],'long':[121,150],'epic':[151,999]};
const COUNTRY_MAP={'english only':['hollywood','british'],'hollywood':['hollywood'],'british':['british'],'french':['french'],'korean':['korean'],'japanese':['japanese'],'scandinavian':['scandinavian'],'indian':['indian'],'spanish':['spanish'],'italian':['italian'],'german':['german']};

const scoreFilm=(film,answers)=>{
let score=Math.random()*1.2;
const reasons=[];
for(const key of Object.keys(answers)){
const rawVal=answers[key];
if(rawVal==null||rawVal==='')continue;
if(key==='streaming'){
const arr=Array.isArray(rawVal)?rawVal:[];
if(arr.length&&!arr.includes('ALL')){ if(arr.includes(film.streaming)){score+=2;reasons.push('available on '+film.streaming);} else score-=1; }
continue;
}
const val=Array.isArray(rawVal)?rawVal.map(normTxt).join(' '):normTxt(rawVal);
if(!val)continue;
switch(key){
case 'genre':
for(const g of film.gTags){ if(val.includes(g)){score+=4;reasons.push(g);} }
break;
case 'tone': case 'vibe':
for(const t of film.tone){ if(val.includes(t)){score+=3;reasons.push(t+' tone');} }
break;
case 'calibre':
for(const c of film.cal){ if(val.includes(c)){score+=3;reasons.push(c);} }
break;
case 'country':{
const k=Object.keys(COUNTRY_MAP).find(k=>val.includes(k));
if(k){ if(COUNTRY_MAP[k].includes(film.country))score+=3; else score-=2; }
break;}
case 'era':{
const k=Object.keys(ERA_MAP).find(k=>val.includes(k));
if(k){ if(ERA_MAP[k].includes(film.decade))score+=3; else score-=1; }
break;}
case 'runtime':{
const k=Object.keys(RUNTIME_MAP).find(k=>val.includes(k));
if(k){ const[lo,hi]=RUNTIME_MAP[k]; if(film.mins>=lo&&film.mins<=hi)score+=2; else score-=1; }
break;}
case 'age':
if(!val.includes("don't mind")){
const want=AGE_ORDER.indexOf(val);
const have=AGE_ORDER.indexOf(film.ageRating.toLowerCase());
if(want>=0&&have>=0){ if(have<=want)score+=2; else score-=5; }
}
break;
case 'who':
if(val.includes('family')||val.includes('kids')){ if(film.kids)score+=5; else score-=3; }
else if(val.includes('date')){ if(film.tone.includes('dreamy')||film.tone.includes('emotional')||film.gTags.includes('romance'))score+=2; }
else if(val.includes('nerds')){ if(film.cal.includes('cult classic')||film.cal.includes('critics fave'))score+=2; }
break;
case 'pacing':
if(val.includes('slow')){ if(film.tone.includes('dreamy')||film.tone.includes('dark'))score+=2; }
else if(val.includes('fast')||val.includes('relentless')){ if(film.tone.includes('tense')||film.tone.includes('epic'))score+=2; }
break;
case 'adventure':
if(val.includes('wildcard')||val.includes('push')){ if(film.cal.includes('cult classic')||film.cal.includes('hidden gem')||film.cal.includes('underrated'))score+=2; }
else if(val.includes('safe')){ if(film.cal.includes('crowd pleaser'))score+=2; }
break;
case 'actors': case 'vibeFilms': case 'extra':{
const words=val.split(/[,\s]+/).filter(w=>w.length>3);
for(const w of words){ if(film.title.toLowerCase().includes(w)||film.director.toLowerCase().includes(w)){score+=5;reasons.push('matches '+w);} }
break;}
case 'avoid':
if(val.includes('violence')||val.includes('gore')){ if(film.ageRating==='18'&&(film.gTags.includes('horror')||film.gTags.includes('war')||film.gTags.includes('crime')))score-=6; }
if(val.includes('jump scares')){ if(film.gTags.includes('horror'))score-=6; }
break;
default: break;
}
}
return {score,reasons};
};

const toFilmObj=(f,extraReasons=[],answers={})=>{
const uniq=[...new Set(extraReasons)].slice(0,3);
const why=uniq.length?`Matches your pick for ${uniq.join(', ')} — a strong fit for tonight.`:`A well-loved film that should hit the spot based on what you're after.`;
return {title:f.title,year:f.year,genre:f.genre,director:f.director,runtime:f.runtime,description:f.description,whyThisFilm:why,rottenTomatoes:f.rottenTomatoes,imdb:f.imdb,letterboxd:f.letterboxd,ageRating:f.ageRating,streaming:f.streaming};
};

const pickFilms=(answers,count,excludeTitles=[],lbTitles=[])=>{
const banned=new Set([...excludeTitles,...lbTitles].map(t=>String(t).toLowerCase()));
const pool=FILM_DB.filter(f=>!banned.has(f.title.toLowerCase()));
const scored=pool.map(f=>({f,...scoreFilm(f,answers)})).sort((a,b)=>b.score-a.score);
let top=scored.slice(0,Math.max(count*4,12));
for(let i=top.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[top[i],top[j]]=[top[j],top[i]];}
const chosen=top.slice(0,count).sort((a,b)=>b.score-a.score);
return chosen.map(({f,reasons})=>toFilmObj(f,reasons,answers));
};

/* ===== POSTER FETCH — Apple iTunes artwork (free, no key, JSONP so it works from file://) ===== */
const posterCache={};
let jsonpN=0;
const fetchPoster=(title,year)=>new Promise(resolve=>{
const key=(String(title)+'|'+(year||'')).toLowerCase();
if(Object.prototype.hasOwnProperty.call(posterCache,key))return resolve(posterCache[key]);
if(typeof document==='undefined')return resolve(null);
let done=false;
const cb='itcb_'+(++jsonpN);
const cleanup=()=>{try{delete window[cb];}catch(e){}const el=document.getElementById(cb);if(el)el.remove();};
const finish=v=>{if(done)return;done=true;posterCache[key]=v;cleanup();resolve(v);};
window[cb]=data=>{
try{
const rs=(data&&data.results)||[];
let best=rs[0];
if(year){const m=rs.find(r=>r.releaseDate&&String(r.releaseDate).startsWith(String(year)));if(m)best=m;}
if(best&&best.artworkUrl100)finish(best.artworkUrl100.replace('100x100bb','600x600bb'));
else finish(null);
}catch(e){finish(null);}
};
try{
const s=document.createElement('script');
s.id=cb;
s.src='https://itunes.apple.com/search?media=movie&entity=movie&limit=6&callback='+cb+'&term='+encodeURIComponent(title);
s.onerror=()=>finish(null);
document.head.appendChild(s);
}catch(e){finish(null);}
setTimeout(()=>finish(null),6000);
});

const tmdbGet=async(key,path,params={})=>{
const u=new URL('https://api.themoviedb.org/3'+path);
u.searchParams.set('api_key',key);
Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!==null&&v!=='')u.searchParams.set(k,v);});
const r=await fetch(u.toString());
if(!r.ok)throw new Error('TMDB '+r.status);
return r.json();
};

const tmdbCert=det=>{try{const rd=(det.release_dates&&det.release_dates.results)||[];const gb=rd.find(x=>x.iso_3166_1==='GB')||rd.find(x=>x.iso_3166_1==='US');if(!gb)return '';const c=gb.release_dates.map(r=>r.certification).find(x=>x);return c||'';}catch(e){return '';}};
const tmdbProvider=det=>{try{const res=det['watch/providers']&&det['watch/providers'].results;const gb=res&&(res.GB||res.US);const list=gb&&(gb.flatrate||gb.free||gb.ads);const name=list&&list[0]&&list[0].provider_name;return name?(TMDB_PROVIDER[name]||name):'';}catch(e){return '';}};
const tmdbDirector=det=>{try{const c=det.credits&&det.credits.crew;const d=c&&c.find(x=>x.job==='Director');return d?d.name:'';}catch(e){return '';}};

const tmdbToFilm=(m,det)=>{
const year=String((m.release_date||det.release_date||'')).slice(0,4);
const genres=(det.genres||[]).map(g=>g.name).slice(0,2).join('/');
const va=m.vote_average||det.vote_average||0;
return {
title:m.title||det.title,year,genre:genres,director:tmdbDirector(det),
runtime:det.runtime?formatRuntime(det.runtime):'',
description:m.overview||det.overview||'',
whyThisFilm:'',
rottenTomatoes:'',imdb:va?va.toFixed(1)+'/10':'',letterboxd:'',
ageRating:tmdbCert(det),streaming:tmdbProvider(det),
posterUrl:m.poster_path?TMDB_IMG+m.poster_path:(det.poster_path?TMDB_IMG+det.poster_path:null),
tmdbId:m.id||det.id,mins:det.runtime||0
};
};

const tmdbEnrich=async(key,m)=>{
try{const det=await tmdbGet(key,'/movie/'+m.id,{append_to_response:'credits,watch/providers,release_dates'});return tmdbToFilm(m,det);}
catch(e){return tmdbToFilm(m,m);}
};

// Build a TMDB /discover query from the app's answer object
const tmdbDiscoverParams=answers=>{
const YEAR=new Date().getFullYear();
const p={include_adult:false,include_video:false,language:'en-GB',region:'GB','vote_count.gte':40,sort_by:'popularity.desc'};
const gv=normTxt(answers.genre||'');
const genreId=Object.keys(TMDB_GENRE).find(k=>gv.includes(k));
if(genreId)p.with_genres=TMDB_GENRE[genreId];
const era=normTxt(answers.era||'');
const setYears=(a,b)=>{p['primary_release_date.gte']=a+'-01-01';p['primary_release_date.lte']=b+'-12-31';};
if(era.includes('brand new'))setYears(YEAR-2,YEAR);
else if(era.includes('recent'))setYears(YEAR-5,YEAR);
else if(era.includes('2010'))setYears(2010,2019);
else if(era.includes('2000'))setYears(2000,2009);
else if(era.includes('90'))setYears(1990,1999);
else if(era.includes('80'))setYears(1980,1989);
else if(era.includes('70')||era.includes('earlier'))p['primary_release_date.lte']='1979-12-31';
const cty=normTxt(answers.country||'');
const langK=Object.keys(TMDB_LANG).find(k=>cty.includes(k));
if(langK)p.with_original_language=TMDB_LANG[langK];
else if(cty.includes('british'))p.with_origin_country='GB';
else if(cty.includes('hollywood')||cty.includes('english only'))p.with_original_language='en';
const rt=normTxt(answers.runtime||'');
if(rt.includes('quick')||rt.includes('under 90'))p['with_runtime.lte']=90;
else if(rt.includes('standard'))p['with_runtime.gte']=90,p['with_runtime.lte']=120;
else if(rt.includes('long'))p['with_runtime.gte']=120,p['with_runtime.lte']=150;
else if(rt.includes('epic'))p['with_runtime.gte']=150;
const age=normTxt(answers.age||'');
if(!age.includes("don't")&&age){p.certification_country='GB';p['certification.lte']=stripEmoji(answers.age).trim();}
const cal=normTxt(answers.calibre||'');
const adv=normTxt(answers.adventure||'');
if(cal.includes('hidden gem')||cal.includes('underrated')||adv.includes('wildcard')||adv.includes('obscure')){p['vote_count.gte']=30;p.sort_by='vote_average.desc';p['vote_average.gte']=6.5;}
else if(cal.includes('oscar')||cal.includes('critics')||adv.includes('safe')){p['vote_count.gte']=300;p.sort_by='vote_average.desc';p['vote_average.gte']=7;}
else if(cal.includes('box office')||cal.includes('crowd')){p.sort_by='revenue.desc';p['vote_count.gte']=200;}
return p;
};

const tmdbDiscover=async(key,answers,count,excl=[],lbT=[])=>{
const p=tmdbDiscoverParams(answers);
p.page=1+Math.floor(Math.random()*4);
let data=await tmdbGet(key,'/discover/movie',p);
let results=(data.results||[]).filter(m=>m.overview);
if(results.length<count&&p.page>1){data=await tmdbGet(key,'/discover/movie',{...p,page:1});results=(data.results||[]).filter(m=>m.overview);}
const banned=new Set([...excl,...lbT].map(s=>String(s).toLowerCase()));
results=results.filter(m=>!banned.has(String(m.title||'').toLowerCase()));
for(let i=results.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[results[i],results[j]]=[results[j],results[i]];}
const chosen=results.slice(0,count);
const films=await Promise.all(chosen.map(m=>tmdbEnrich(key,m)));
return films.filter(f=>f&&f.title);
};

// Actor deep dive from the web (unlimited actors)
const tmdbActor=async(key,name)=>{
const ps=await tmdbGet(key,'/search/person',{query:name,language:'en-GB'});
const person=(ps.results||[])[0];
if(!person)return null;
const cr=await tmdbGet(key,'/person/'+person.id,{append_to_response:'movie_credits'});
const acting=((cr.movie_credits&&cr.movie_credits.cast)||[]).filter(m=>m.release_date&&m.vote_count>100&&m.poster_path);
acting.sort((a,b)=>(b.vote_average*Math.log10(b.vote_count+1))-(a.vote_average*Math.log10(a.vote_count+1)));
const top=acting.slice(0,5).map((m,i)=>({rank:i+1,title:m.title,year:String(m.release_date).slice(0,4),role:m.character||'',genre:'',director:'',description:m.overview||'',rottenTomatoes:'',imdb:(m.vote_average||0).toFixed(1)+'/10',letterboxd:'',posterUrl:m.poster_path?TMDB_IMG+m.poster_path:null}));
const under=acting.slice(5,20).sort((a,b)=>b.vote_average-a.vote_average)[0];
return {actor:cr.name||name,careerArc:(cr.biography||'').split('. ').slice(0,2).join('. ')||`A prolific screen career spanning ${acting.length}+ notable films.`,films:top,underrated:under?{title:under.title,year:String(under.release_date).slice(0,4),role:under.character||'',reason:'A lesser-seen role worth seeking out.'}:null};
};

const localVerdict=(fA,fB)=>{
const scoreOf=f=>{const rt=parseFloat(f.rottenTomatoes)||0;const imdb=(parseFloat(f.imdb)||0)*10;return (rt+imdb)/2;};
const sA=scoreOf(fA),sB=scoreOf(fB);
const winner=sA>=sB?fA:fB, loser=winner===fA?fB:fA;
const diff=Math.abs(sA-sB);
const verdict=diff<3?`Both ${fA.title} and ${fB.title} are close calls — either one is a safe bet tonight.`:`${winner.title} edges it, with stronger combined scores than ${loser.title}.`;
const winReason=diff<3?`It really comes down to mood — flip a coin.`:`Higher combined critic and audience scores made the difference.`;
return {verdict,winner:winner.title,winReason};
};

const scoreOf=f=>f?(parseFloat(f.rottenTomatoes)+parseFloat(f.imdb)*10)/2:50+Math.random()*30;
const s1=scoreOf(m1), s2=scoreOf(m2);
const film1={title:t1,argument:`${t1} makes its case on ${criteria} — it's the kind of film that sticks with you well after the credits roll.`,strengths:['Strong sense of identity','Memorable execution of its central idea']};
const film2={title:t2,argument:`${t2} counters with its own take on ${criteria}, and has just as loyal a following.`,strengths:['Confident pacing','A distinct voice of its own']};
const bothKnown=!!(m1&&m2);
const winner=s1>=s2?t1:t2, loser=winner===t1?t2:t1;
const verdict=bothKnown?`Going by combined critic and audience scores, ${winner} narrowly wins out over ${loser} — though both are well worth your time.`:`This one's genuinely close to a coin flip based on vibe rather than hard data — both have passionate fans.`;
const winReason=bothKnown?'Higher aggregate scores across the board.':'Flip a coin — both have their fans.';
return {film1,film2,verdict,winner,winReason};
};

const genAutopsy=(answers,excl,lbTitles)=>{
const film=answers.film||'the film';
const wrong=normTxt(answers.wrong||'');
const hoped=normTxt(answers.hoped||'');
const DIAG={'story':`The story in ${film} likely didn't give you enough reason to care before asking you to follow it somewhere complicated.`,'acting':`If the performances didn't land, it probably pulled you out of the world at exactly the moments it needed you locked in.`,'slow':'Pacing issues usually come down to spending too long setting up and not enough time paying it off.','rushed':'Films that feel rushed are usually trying to cram too much plot into too little time.','sense':"When a film \"makes no sense,\" it's often because the internal logic wasn't set up clearly early on.",'boring':'If it dragged, the problem is usually pacing or a lack of clear stakes.','much':'Sometimes a film leans so hard into intensity that it forgets to earn it.','ending':"A disappointing ending is often a sign the film didn't know what it was building toward."};
const diagKey=Object.keys(DIAG).find(k=>wrong.includes(k));
const diagnosis=DIAG[diagKey]||`Something about ${film} just didn't come together for you — and that's a completely valid reaction.`;
const whatYouWanted=`It sounds like you wanted ${hoped||'something that delivered on its premise'} — a fair ask, and there are films that do exactly that.`;
const fixGenre=normTxt(answers.fixGenre||'');
const gAnswers=(fixGenre&&!fixGenre.includes('same')&&!fixGenre.includes('surprise'))?{genre:answers.fixGenre}:{};
const fixes=pickFilms(gAnswers,2,excl,lbTitles).map(f=>({...f,whyThisFilm:`Fixes exactly what ${film} got wrong${diagKey?' — especially around '+diagKey:''}.`}));
return {film,diagnosis,whatYouWanted,fixes};
};

const genSwap=(answers,excl,lbTitles)=>{

const love=normTxt(answers.love||'');
const LOVE_TONE={'story':'dark','characters':'raw','world':'dreamy','soundtrack':'epic','visuals':'dreamy','humour':'funny','emotion':'emotional','mind-bending':'mind-bending'};
const loveKey=Object.keys(LOVE_TONE).find(k=>love.includes(k));
const originalTone=LOVE_TONE[loveKey]||'dark';
const OPPOSITE_TONE={'dark':'light','light':'dark','raw':'dreamy','dreamy':'raw','epic':'raw','funny':'dark','emotional':'absurd','mind-bending':'heartwarming'};
const oppositeTone=OPPOSITE_TONE[originalTone]||'light';
const avoidGenre=normTxt(answers.avoidGenre||'');
let pool=FILM_DB.filter(f=>f.tone.includes(oppositeTone)&&!excl.includes(f.title)&&!lbTitles.includes(f.title));
if(avoidGenre)pool=pool.filter(f=>!f.gTags.some(g=>avoidGenre.includes(g)));
if(!pool.length)pool=FILM_DB.filter(f=>!excl.includes(f.title));
const pick=randomPick(pool.length?pool:FILM_DB);
const opposite=toFilmObj(pick,[oppositeTone+' tone']);
const original={title:film,analysis:`You're drawn to its ${answers.love||'central quality'} — that's usually exactly the part of ${film} that hits hardest.`};
const whyOpposite=`Where ${film} leans ${originalTone}, ${pick.title} goes almost entirely ${oppositeTone} — same medium, completely different headspace.`;
return {original,opposite,whyOpposite};
};

/* ===== LETTERBOXD UTILITIES ===== */
const parseCSVLine=s=>{const r=[];let c='',q=false;for(let i=0;i<s.length;i++){if(s[i]==='"'){q=!q}else if(s[i]===','&&!q){r.push(c);c=''}else{c+=s[i]}}r.push(c);return r.map(x=>x.trim().replace(/^"|"$/g,''))};

const parseLBCsv=text=>{
const lines=text.split('\n').filter(l=>l.trim());
if(lines.length<2)return[];
const hdr=parseCSVLine(lines[0]).map(h=>h.toLowerCase());
const ti=hdr.findIndex(h=>/^(name|title|film)/.test(h));
const yi=hdr.findIndex(h=>/^year/.test(h));
const ri=hdr.findIndex(h=>/^rating/.test(h));
if(ti<0)return[];
const seen=new Set(),films=[];
for(let i=1;i<lines.length;i++){
const cols=parseCSVLine(lines[i]);
const title=cols[ti]?.trim();
if(!title||seen.has(title))continue;
seen.add(title);
let rating=ri>=0?parseFloat(cols[ri]):null;
if(rating&&rating>5)rating=rating/2;
films.push({title,year:yi>=0?cols[yi]?.trim():'',rating:isNaN(rating)?null:rating});
}return films};

const loadJSZip=()=>new Promise((res,rej)=>{
if(window.JSZip)return res(window.JSZip);
const s=document.createElement('script');
s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
s.onload=()=>res(window.JSZip);s.onerror=rej;document.head.appendChild(s)});

const parseLBZip=async file=>{
const JSZip=await loadJSZip();
const zip=await JSZip.loadAsync(file);
for(const name of['ratings.csv','diary.csv','watched.csv','reviews.csv']){
const f=zip.file(name);if(f){const t=await f.async('text');const r=parseLBCsv(t);if(r.length)return r}}
return[]};

const Wizard=({icon,title,steps,onDone,strSel,onStrToggle})=>{
const[step,setStep]=useState(0);
const[answers,setAnswers]=useState({});
const[text,setText]=useState('');
const[showCustom,setShowCustom]=useState(false);
const cur=steps[step];

const next=val=>{
const na={...answers,[cur.id]:val};
setAnswers(na);setText('');setShowCustom(false);
if(step<steps.length-1)setStep(step+1);else onDone(na)};
const skip=()=>{setText('');setShowCustom(false);if(step<steps.length-1)setStep(step+1);else onDone(answers)};
const back=()=>{if(step>0){setStep(step-1);setText('')}};

return<Shell><Hdr title={title} onBack={step>0?back:null}/><ProgBar step={step+1} total={steps.length}/><div key={step} style={{animation:'si 0.3s ease',padding:'20px 0'}}>

<div style={{display:'flex',gap:8,marginTop:16}}><Btn primary onClick={()=>next(text.trim())} disabled={!text.trim()}>Next</Btn><Btn onClick={skip}>Skip</Btn></div></div>

:<div><div style={{display:'grid',gridTemplateColumns:cur.cols===1?'1fr':'1fr 1fr',gap:8,marginTop:16}}>
{(cur.opts||[]).map((o,i)=>{const label=typeof o==='string'?o:o.l;const val=typeof o==='string'?o:o.v;

</div>}
<button onClick={skip} style={{...sty.tert,background:'none',border:'none',cursor:'pointer',display:'block',margin:'16px auto',fontSize:13}}>Skip →</button>

/* ===== LETTERBOXD IMPORT COMPONENT ===== */
const LBImport=({lb,onDone,onSkip,onBack})=>{
const[dragging,setDragging]=useState(false);
const[err,setErr]=useState(null);
const[loading,setLoading]=useState(false);
const fileRef=useRef();

const handleFile=async file=>{
setErr(null);setLoading(true);
try{
let films;
if(file.name.endsWith('.zip')){films=await parseLBZip(file)}
else if(file.name.endsWith('.csv')){const t=await file.text();films=parseLBCsv(t)}
else{setErr('Please upload a .zip or .csv file');setLoading(false);return}
if(!films.length){setErr('No films found in file');setLoading(false);return}
onDone(films);
}catch(e){setErr('Failed to parse file: '+e.message)}
setLoading(false)};

const onDrop=e=>{e.preventDefault();setDragging(false);const f=e.dataTransfer.files[0];if(f)handleFile(f)};
const onChange=e=>{const f=e.target.files[0];if(f)handleFile(f)};

return<Shell><Hdr title="Import Letterboxd" onBack={onBack}/>
<div style={{textAlign:'center',padding:'40px 0',animation:'fu 0.4s ease'}}>
<div style={{fontSize:48,marginBottom:16}}>📋</div>
<h2 style={{fontFamily:"'Playfair Display',serif",marginBottom:8}}>Import Your Letterboxd</h2>
<p style={sty.sub}>So we don't recommend films you've already seen</p>
{lb.length>0&&<div style={{background:'rgba(74,222,128,0.1)',border:'1px solid rgba(74,222,128,0.2)',borderRadius:12,padding:'12px 16px',marginTop:16,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
<span style={{color:'#4ade80',fontSize:14}}>✅ {lb.length} Letterboxd films loaded</span>
<button onClick={()=>onDone([])} style={{background:'none',border:'none',color:'#e85454',cursor:'pointer',fontSize:13}}>Clear</button></div>}
<div onDragOver={e=>{e.preventDefault();setDragging(true)}} onDragLeave={()=>setDragging(false)} onDrop={onDrop} onClick={()=>fileRef.current.click()}
style={{...sty.card,marginTop:20,padding:'40px 20px',cursor:'pointer',borderColor:dragging?'#e8a948':'rgba(255,255,255,0.08)',borderStyle:'dashed',textAlign:'center'}}>
<input ref={fileRef} type="file" accept=".zip,.csv" style={{display:'none'}} onChange={onChange}/>
{loading?<div style={{animation:'pulse 1.5s infinite'}}>Processing...</div>
:<><div style={{fontSize:32,marginBottom:8}}>📁</div><p style={sty.sub}>Drop your Letterboxd .zip or .csv here</p><p style={sty.tert}>or tap to browse</p></>}
</div>
{err&&<p style={{color:'#e85454',fontSize:14,marginTop:12}}>❌ {err}</p>}
<p style={{...sty.tert,marginTop:16}}>Get your export from <a href="https://letterboxd.com/settings/data/" target="_blank" rel="noopener">letterboxd.com/settings/data/</a></p>
<div style={{display:'flex',gap:8,marginTop:24}}>
{lb.length>0&&<Btn primary onClick={()=>onSkip()}>Continue with {lb.length} films</Btn>}
<Btn onClick={onSkip}>{lb.length>0?'Continue':'Skip'}</Btn></div>
</div></Shell>};

/* ===== MAIN APP COMPONENT ===== */
const App=()=>{
const[phase,setPhase]=useState('home');
const[step,setStep]=useState(0);
const[ans,setAns]=useState({});
const[tAns,setTAns]=useState({});
const[strSel,setStrSel]=useState([]);
const[movies,setMovies]=useState(null);
const[lb,setLb]=useState([]);
const[lastA,setLastA]=useState(null);
const[rIdx,setRIdx]=useState(-1);
const[soL,setSoL]=useState(false);
const[dis,setDis]=useState([]);
const[cmp,setCmp]=useState(new Set());
const[h2h,setH2h]=useState(null);
const[h2hData,setH2hData]=useState(null);
const[moreOpen,setMoreOpen]=useState(false);
const[groupNames,setGroupNames]=useState(['','']);
const[groupStep,setGroupStep]=useState(0);
const[groupAnswers,setGroupAnswers]=useState({});
const[customResults,setCustomResults]=useState(null);
const[rouletteSpinning,setRouletteSpinning]=useState(false);
const[rouletteDeg,setRouletteDeg]=useState(0);
const[totStep,setTotStep]=useState(0);
const[totAnswers,setTotAnswers]=useState([]);
const[err,setErr]=useState(null);
const[copied,setCopied]=useState(false);
const[currentMode,setCurrentMode]=useState(null);
const[selCustomText,setSelCustomText]=useState('');
const[selShowCust,setSelShowCust]=useState(false);
const[textInput,setTextInput]=useState('');
const[genreSearch,setGenreSearch]=useState('');
const[favourites,setFavourites]=useState([]);
const[seen,setSeen]=useState([]);
const[savedToast,setSavedToast]=useState(false);
const[authLoaded,setAuthLoaded]=useState(false);
const[accounts,setAccounts]=useState({});
const[currentUser,setCurrentUser]=useState(GUEST);
const[authMode,setAuthMode]=useState('login');
const[authUser,setAuthUser]=useState('');
const[authPass,setAuthPass]=useState('');
const[authName,setAuthName]=useState('');
const[authErr,setAuthErr]=useState('');
const[tonight,setTonight]=useState(()=>featuredPick());
const[tonightPoster,setTonightPoster]=useState(null);
const[lbReturn,setLbReturn]=useState('home');
const[tmdbKey,setTmdbKey]=useState('');
const[keyInput,setKeyInput]=useState('');
const[keyStatus,setKeyStatus]=useState('');
useEffect(()=>{let ok=true;if(tonight&&tonight.posterUrl){setTonightPoster(tonight.posterUrl);return;}setTonightPoster(null);if(tonight&&tonight.title)fetchPoster(tonight.title,tonight.year).then(u=>{if(ok)setTonightPoster(u)});return()=>{ok=false}},[tonight&&tonight.title,tonight&&tonight.posterUrl]);
const refreshTonight=async()=>{if(tmdbKey){try{const f=await tmdbRandomGreat(tmdbKey,[],[]);if(f){setTonight(f);return;}}catch(e){}}setTonight(featuredPick());};
useEffect(()=>{if(tmdbKey){refreshTonight();}},[tmdbKey]);

const home=()=>{setPhase('home');setStep(0);setAns({});setTAns({});setMovies(null);setLastA(null);setRIdx(-1);setSoL(false);setDis([]);setCmp(new Set());setH2h(null);setH2hData(null);setMoreOpen(false);setGroupNames(['','']);setGroupStep(0);setGroupAnswers({});setCustomResults(null);setRouletteSpinning(false);setRouletteDeg(0);setTotStep(0);setTotAnswers([]);setErr(null);setCopied(false);setCurrentMode(null);setSelCustomText('');setSelShowCust(false);setTextInput('');setGenreSearch('')};

const lbTitles=()=>lb.map(f=>f.title);

/* ===== ACCOUNTS (stored on this device — no server) ===== */
const applyUserData=acc=>{
setFavourites(Array.isArray(acc?.favourites)?acc.favourites:[]);
setSeen(Array.isArray(acc?.seen)?acc.seen:[]);
setStrSel(Array.isArray(acc?.strSel)?acc.strSel:[]);
setLb(Array.isArray(acc?.lb)?acc.lb:[]);
};

useEffect(()=>{
let accs={},sess=GUEST;
try{const ra=localStorage.getItem(ACCOUNTS_KEY);if(ra)accs=JSON.parse(ra)||{};}catch(e){}
try{const rs=localStorage.getItem(SESSION_KEY);if(rs&&(rs===GUEST||accs[rs]))sess=rs;}catch(e){}
if(!accs[GUEST])accs[GUEST]={username:GUEST,displayName:'Guest',favourites:[],seen:[],strSel:[],lb:[]};
setAccounts(accs);setCurrentUser(sess);applyUserData(accs[sess]||accs[GUEST]);
try{const k=localStorage.getItem('filmpicker_tmdb_key');if(k){setTmdbKey(k);setKeyInput(k);}}catch(e){}
setAuthLoaded(true);
},[]);

const saveTmdbKey=async()=>{
const k=keyInput.trim();
if(!k)return setKeyStatus('Please paste your key first.');
setKeyStatus('Checking…');
try{
const r=await fetch('https://api.themoviedb.org/3/configuration?api_key='+encodeURIComponent(k));
if(!r.ok)throw new Error(r.status===401?'That key was rejected — double-check you copied the full API Key (v3 auth).':'Could not verify (HTTP '+r.status+').');
setTmdbKey(k);try{localStorage.setItem('filmpicker_tmdb_key',k);}catch(e){}
setKeyStatus('✅ Connected! The app now pulls films from the web.');
}catch(e){setKeyStatus('⚠️ '+(e.message||'Could not reach TMDB. Check your connection and the key.'));}
};
const clearTmdbKey=()=>{setTmdbKey('');setKeyInput('');setKeyStatus('');try{localStorage.removeItem('filmpicker_tmdb_key');}catch(e){}};

// Persist the active user's data whenever it changes
useEffect(()=>{
if(!authLoaded)return;
setAccounts(prev=>{
const next={...prev,[currentUser]:{...(prev[currentUser]||{username:currentUser,displayName:currentUser===GUEST?'Guest':currentUser}),favourites,seen,strSel,lb}};
try{localStorage.setItem(ACCOUNTS_KEY,JSON.stringify(next));}catch(e){}
return next;
});
},[favourites,seen,strSel,lb,authLoaded]);

const persistSession=u=>{try{localStorage.setItem(SESSION_KEY,u);}catch(e){}};
const account=accounts[currentUser]||null;
const isLoggedIn=currentUser!==GUEST;
const displayName=isLoggedIn?(account?.displayName||currentUser):'Guest';

const emptyGuest=()=>({username:GUEST,displayName:'Guest',favourites:[],seen:[],strSel:[],lb:[]});
// Merge the current in-memory (guest) data into a target account, de-duplicating.
const claimGuestInto=acc=>{
const mFav=[...(acc.favourites||[])];favourites.forEach(f=>{if(!mFav.some(x=>x.title===f.title&&x.year===f.year))mFav.push(f);});
const mSeen=[...(acc.seen||[])];seen.forEach(f=>{if(!mSeen.some(x=>x.title===f.title))mSeen.push(f);});
const mLb=[...(acc.lb||[])];lb.forEach(f=>{if(!mLb.some(x=>x.title===f.title))mLb.push(f);});
const mStr=[...new Set([...(acc.strSel||[]),...strSel])];
return {...acc,favourites:mFav,seen:mSeen,lb:mLb,strSel:mStr};
};
// Commit a target account + reset the guest slot in one atomic write.
const commitUser=(u,acc)=>{
setAccounts(prev=>{const next={...prev,[u]:acc,[GUEST]:emptyGuest()};try{localStorage.setItem(ACCOUNTS_KEY,JSON.stringify(next));}catch(e){}return next;});
setCurrentUser(u);persistSession(u);applyUserData(acc);
};

const doSignUp=()=>{
const u=authUser.trim().toLowerCase();
const name=authName.trim()||authUser.trim();
if(u.length<3)return setAuthErr('Username must be at least 3 characters.');
if(!/^[a-z0-9_]+$/.test(u))return setAuthErr('Username can only use letters, numbers and underscores.');
if(u===GUEST)return setAuthErr('That username is reserved. Please choose another.');
if(authPass.length<4)return setAuthErr('Password must be at least 4 characters.');
if(accounts[u])return setAuthErr('That username is already taken on this device.');
// New account claims the guest's current favourites/seen/etc, and the guest slot is cleared.
const newAcc={username:u,displayName:name,passHash:hashPw(authPass),createdAt:Date.now(),favourites:[...favourites],seen:[...seen],strSel:[...strSel],lb:[...lb]};
commitUser(u,newAcc);
setAuthErr('');setAuthUser('');setAuthPass('');setAuthName('');setPhase('account');
};

const doLogIn=()=>{
const u=authUser.trim().toLowerCase();
const acc=accounts[u];
if(!acc||acc.passHash!==hashPw(authPass))return setAuthErr('Wrong username or password.');
// Carry any favourites the user added as a guest into their account (matches signup behaviour).
const claimed=claimGuestInto(acc);
commitUser(u,claimed);
setAuthErr('');setAuthUser('');setAuthPass('');setAuthName('');setPhase('account');
};

const doLogOut=()=>{
const g=emptyGuest();
setAccounts(prev=>{const next={...prev,[GUEST]:g};try{localStorage.setItem(ACCOUNTS_KEY,JSON.stringify(next));}catch(e){}return next;});
setCurrentUser(GUEST);persistSession(GUEST);applyUserData(g);
setPhase('home');
};

const doDeleteAccount=()=>{
if(currentUser===GUEST)return;
const u=currentUser;const g=emptyGuest();
setAccounts(prev=>{const next={...prev};delete next[u];next[GUEST]=g;try{localStorage.setItem(ACCOUNTS_KEY,JSON.stringify(next));}catch(e){}return next;});
setCurrentUser(GUEST);persistSession(GUEST);applyUserData(g);
setPhase('home');
};

const isFavourited=film=>favourites.some(f=>f.title===film.title&&f.year===film.year);
const toggleFavourite=film=>{
setFavourites(prev=>{
if(prev.some(f=>f.title===film.title&&f.year===film.year))return prev.filter(f=>!(f.title===film.title&&f.year===film.year));
setSavedToast(true);setTimeout(()=>setSavedToast(false),1800);
return [...prev,{title:film.title,year:film.year,genre:film.genre,director:film.director,runtime:film.runtime,description:film.description,rottenTomatoes:film.rottenTomatoes,imdb:film.imdb,letterboxd:film.letterboxd,ageRating:film.ageRating,streaming:film.streaming}];
});
};
const markSeen=film=>{setSeen(prev=>prev.some(f=>f.title===film.title)?prev:[...prev,{title:film.title,year:film.year}]);};

// Unified film source: TMDB web when a key is set, otherwise the offline engine.
const getFilms=async(a,count,excl)=>{
if(tmdbKey){try{const f=await tmdbDiscover(tmdbKey,a,count,excl,lbTitles());if(f&&f.length)return f;}catch(e){}}
if(!tmdbKey)await new Promise(r=>setTimeout(r,420));
return pickFilms(a,count,excl,lbTitles());
};

const fetchFilms=async(a,count=3)=>{
setPhase('loading');setLastA(a);
try{
const films=await getFilms(a,count,dis);
if(!films.length){setErr('No films matched those choices — try loosening a filter or two.');setPhase('error');return;}
setMovies({reason:buildReason(a,films),films});setPhase('results');
}catch(e){setErr(e.message);setPhase('error');}
};

const replaceFn=async idx=>{
if(rIdx>=0)return;
setRIdx(idx);
const film=movies.films[idx];
markSeen(film);
const newDis=[...dis,film.title];setDis(newDis);
try{
const excl=[...newDis,...movies.films.map(x=>x.title)];
const rep=(await getFilms(lastA||{},1,excl))[0];
if(rep){const nf=[...movies.films];nf[idx]=rep;setMovies(m=>({...m,films:nf}));}
}catch(e){}
setRIdx(-1);
};

const secondOpinion=async direction=>{
setSoL(true);
let a={...lastA};
if(direction==='More adventurous')a={...a,calibre:'Hidden Gem'};
else if(direction==='Safer picks')a={...a,calibre:'Crowd Pleaser'};
else if(direction==='More obscure')a={...a,calibre:'Underrated'};
else if(direction==='More popular')a={...a,calibre:'Box Office Smash'};
else if(direction==='Completely different'){a={...a,genre:'',tone:''};}
const excl=[...dis,...(movies?.films||[]).map(f=>f.title)];
try{
const films=await getFilms(a,3,excl);
if(films.length){setMovies({reason:buildReason(a,films),films});setDis(excl);setCmp(new Set());}
}catch(e){}
setSoL(false);
};

const compareFilms=()=>{
const indices=[...cmp];
const fA=movies.films[indices[0]],fB=movies.films[indices[1]];
setH2h({a:fA,b:fB});setH2hData(null);setPhase('h2h');
setTimeout(()=>{setH2hData(localVerdict(fA,fB))},500);
};

const sharePicks=()=>{
if(!movies||!movies.films)return;
const txt=movies.films.map((f,i)=>`${i+1}. ${f.title} (${f.year})\n   Director: ${f.director}\n   ${f.rottenTomatoes?'RT: '+f.rottenTomatoes:''} ${f.imdb?'IMDb: '+f.imdb:''} ${f.letterboxd?'LB: '+f.letterboxd:''}\n   ${f.description}`).join('\n\n');
navigator.clipboard.writeText('🎬 Film Picks\n\n'+txt).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2500)})};

const strToggle=s=>{if(s==='ALL'){setStrSel([])}else{setStrSel(p=>p.includes(s)?p.filter(x=>x!==s):[...p,s])}};

/* ===== FULL PICKER SELECT QUESTIONS ===== */
const renderSelectQ=()=>{
const q=SEL_QS[step];
const advance=val=>{setSelCustomText('');setSelShowCust(false);setGenreSearch('');setAns({...ans,[q.id]:val});if(step<SEL_QS.length-1)setStep(step+1);else setStep(SEL_QS.length)};
const skipQ=()=>{setSelCustomText('');setSelShowCust(false);setGenreSearch('');if(step<SEL_QS.length-1)setStep(step+1);else setStep(SEL_QS.length)};
const isBigList=q.opts.length>10;
const filteredOpts=isBigList&&genreSearch.trim()?q.opts.filter(o=>stripEmoji(o).toLowerCase().includes(genreSearch.trim().toLowerCase())):q.opts;

return<Shell><Hdr title="Film Picker" onBack={step>0?()=>{setSelCustomText('');setSelShowCust(false);setGenreSearch('');setStep(step-1)}:()=>home()}/><ProgBar step={step+1} total={SEL_QS.length+TEXT_QS.length}/>
<div key={step} style={{animation:'si 0.3s ease',padding:'12px 0'}}>
<h2 style={{fontFamily:"'Playfair Display',serif",fontSize:22,textAlign:'center',marginBottom:6}}>{q.q}</h2>
{q.sub&&<p style={{...sty.sub,textAlign:'center',marginBottom:12}}>{q.sub}</p>}
{isBigList&&<input style={{...sty.input,marginBottom:12}} value={genreSearch} onChange={e=>setGenreSearch(e.target.value)} placeholder="🔎 Search options..."/>}
<div style={{display:'grid',gridTemplateColumns:q.cols===2?'1fr 1fr':'1fr',gap:8}}>
{filteredOpts.map((o,i)=><button key={i} onClick={()=>advance(o)} style={{...sty.card,cursor:'pointer',textAlign:'center',fontSize:14,padding:'12px 8px'}} onMouseOver={e=>e.currentTarget.style.borderColor='#e8a948'} onMouseOut={e=>e.currentTarget.style.borderColor='rgba(255,255,255,0.08)'}>{o}</button>)}
{isBigList&&filteredOpts.length===0&&<p style={{...sty.tert,gridColumn:'1 / -1',textAlign:'center',padding:'12px 0'}}>No matches — try "Type your own" below.</p>}
</div>
<div style={{marginTop:12}}><button style={{...sty.tert,background:'none',border:'none',cursor:'pointer',fontSize:13}} onClick={()=>setSelShowCust(!selShowCust)}>✏️ Type your own</button>
{selShowCust&&<div style={{display:'flex',gap:8,marginTop:8}}><input style={{...sty.input,flex:1}} value={selCustomText} onChange={e=>setSelCustomText(e.target.value)} placeholder="Type here..." onKeyDown={e=>e.key==='Enter'&&selCustomText.trim()&&advance(selCustomText.trim())}/><Btn primary onClick={()=>selCustomText.trim()&&advance(selCustomText.trim())} style={{width:'auto',padding:'12px 16px'}}>Use</Btn></div>}
</div>
<button onClick={skipQ} style={{...sty.tert,background:'none',border:'none',cursor:'pointer',display:'block',margin:'16px auto',fontSize:13}}>Skip →</button>
</div></Shell>};

/* ===== FULL PICKER TEXT QUESTIONS ===== */
const renderTextQ=()=>{
const qi=step-SEL_QS.length;
const q=TEXT_QS[qi];
const advance=val=>{setTextInput('');setTAns({...tAns,[q.id]:val});if(qi<TEXT_QS.length-1)setStep(step+1);else{fetchFilms({...ans,...tAns,[q.id]:val,streaming:strSel})}};
const skipQ=()=>{setTextInput('');if(qi<TEXT_QS.length-1)setStep(step+1);else{fetchFilms({...ans,...tAns,streaming:strSel})}};

if(q.special==='streaming')return<Shell><Hdr title="Film Picker" onBack={()=>setStep(step-1)}/><ProgBar step={step+1} total={SEL_QS.length+TEXT_QS.length}/>
<div style={{animation:'si 0.3s ease',padding:'20px 0'}}><h2 style={{fontFamily:"'Playfair Display',serif",fontSize:22,textAlign:'center',marginBottom:16}}>{q.q}</h2>
<StreamCheck sel={strSel} onToggle={strToggle}/>
<div style={{display:'flex',gap:8,marginTop:20}}><Btn primary onClick={()=>advance(strSel)}>Next</Btn><Btn onClick={skipQ}>Skip</Btn></div></div></Shell>;

return<Shell><Hdr title="Film Picker" onBack={()=>{setTextInput('');setStep(step-1)}}/><ProgBar step={step+1} total={SEL_QS.length+TEXT_QS.length}/>
<div key={step} style={{animation:'si 0.3s ease',padding:'20px 0'}}>
<h2 style={{fontFamily:"'Playfair Display',serif",fontSize:22,textAlign:'center',marginBottom:16}}>{q.q}</h2>
{qi===TEXT_QS.length-1?<textarea style={{...sty.input,minHeight:80,resize:'vertical'}} value={textInput} onChange={e=>setTextInput(e.target.value)} placeholder={q.ph}/>

/* ===== ROULETTE SCREEN ===== */
const renderRoulette=()=>(
<Shell><Hdr title="Film Roulette" onBack={home}/>
<div style={{textAlign:'center',padding:'60px 0',animation:'fu 0.4s ease'}}>
<div style={{fontSize:80,marginBottom:24,display:'inline-block',transition:rouletteSpinning?'transform 3s cubic-bezier(0.17,0.67,0.12,0.99)':'none',transform:rouletteSpinning?`rotate(${rouletteDeg}deg)`:'none'}}>🎰</div>
<h2 style={{fontFamily:"'Playfair Display',serif",fontSize:28,marginBottom:8}}>Film Roulette</h2>
<p style={sty.sub}>Spin the wheel and let fate decide</p>
<Btn primary onClick={doRoulette} disabled={rouletteSpinning} style={{marginTop:32,maxWidth:240,margin:'32px auto 0'}}>
{rouletteSpinning?'Spinning...':'🎰 Spin the Wheel'}</Btn>
<Btn onClick={home} style={{marginTop:12,maxWidth:240,margin:'12px auto 0'}}>🏠 Home</Btn>
</div></Shell>);

/* ===== ERROR SCREEN ===== */
const renderError=()=>(
<Shell><div style={{textAlign:'center',padding:'80px 20px',animation:'fu 0.4s ease'}}>
<div style={{fontSize:48,marginBottom:16}}>😵</div>
<h2 style={{fontFamily:"'Playfair Display',serif",marginBottom:8}}>Something went wrong</h2>
<p style={{...sty.sub,marginBottom:4}}>{err||'An unexpected error occurred'}</p>
<div style={{display:'flex',gap:8,marginTop:24,justifyContent:'center'}}>
<Btn primary onClick={()=>{setErr(null);if(lastA)fetchFilms(lastA);else home()}}>Try Again</Btn>
<Btn onClick={home}>🏠 Home</Btn>
</div></div></Shell>);

/* ===== PHASE ROUTER ===== */
if(phase==='home')return renderHome();
if(phase==='auth')return renderAuth();
if(phase==='account')return renderAccount();
if(phase==='apikey')return renderApiKey();
if(phase==='favourites')return renderFavourites();
if(phase==='history')return renderHistory();
if(phase==='error')return renderError();
if(phase==='loading')return<Shell><Loader/></Shell>;
if(phase==='h2h')return renderH2H();
if(phase==='tot')return renderToT();
if(phase==='roulette')return renderRoulette();
if(phase==='group')return renderGroupSetup();
if(phase==='group_vote')return renderGroupVote();

if(phase==='lb'||phase==='lb_standalone')return<LBImport lb={lb} onBack={phase==='lb_standalone'?()=>setPhase(lbReturn):null} onDone={films=>{setLb(films);if(phase==='lb'){setPhase('questions');setStep(0)}else setPhase(lbReturn)}} onSkip={()=>{if(phase==='lb'){setPhase('questions');setStep(0)}else setPhase(lbReturn)}}/>;

if(phase==='questions'){
if(step<SEL_QS.length)return renderSelectQ();
return renderTextQ()}

if(phase==='results'){
if(customResults)return renderCustomResults();
return renderResults()}

/* Wizard-based modes */
if(phase==='quick')return<Wizard icon="⚡" title="Quick Pick" steps={QUICK_STEPS} strSel={strSel} onStrToggle={strToggle} onDone={a=>handleWizardDone('quick',a)}/>;
if(phase==='party')return<Wizard icon="🍿" title="Watch Party" steps={PARTY_STEPS} strSel={strSel} onStrToggle={strToggle} onDone={a=>handleWizardDone('party',a)}/>;
if(phase==='debrief')return<Wizard icon="🔍" title="Film Debrief" steps={DEBRIEF_STEPS} strSel={strSel} onStrToggle={strToggle} onDone={a=>handleWizardDone('debrief',a)}/>;
if(phase==='battle')return<Wizard icon="⚔️" title="Film Battle" steps={BATTLE_STEPS} strSel={strSel} onStrToggle={strToggle} onDone={a=>handleWizardDone('battle',a)}/>;
if(phase==='dna')return<Wizard icon="🧬" title="Film DNA" steps={DNA_STEPS} strSel={strSel} onStrToggle={strToggle} onDone={a=>handleWizardDone('dna',a)}/>;
if(phase==='double')return<Wizard icon="🎭" title="Double Bill" steps={DOUBLE_STEPS} strSel={strSel} onStrToggle={strToggle} onDone={a=>handleWizardDone('double',a)}/>;
if(phase==='actor')return<Wizard icon="🌟" title="Actor Deep Dive" steps={ACTOR_STEPS} strSel={strSel} onStrToggle={strToggle} onDone={a=>handleWizardDone('actor',a)}/>;
if(phase==='soundtrack')return<Wizard icon="🎵" title="Soundtrack Finder" steps={SOUNDTRACK_STEPS} strSel={strSel} onStrToggle={strToggle} onDone={a=>handleWizardDone('soundtrack',a)}/>;
if(phase==='autopsy')return<Wizard icon="🔬" title="Film Autopsy" steps={AUTOPSY_STEPS} strSel={strSel} onStrToggle={strToggle} onDone={a=>handleWizardDone('autopsy',a)}/>;
if(phase==='swap')return<Wizard icon="🔄" title="Mood Swap" steps={SWAP_STEPS} strSel={strSel} onStrToggle={strToggle} onDone={a=>handleWizardDone('swap',a)}/>;
if(phase==='family')return<Wizard icon="👨‍👩‍👧‍👦" title="Family Film Picker" steps={FAMILY_STEPS} strSel={strSel} onStrToggle={strToggle} onDone={a=>handleWizardDone('family',a)}/>;

return renderHome();
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
